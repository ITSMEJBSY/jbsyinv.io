<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#050709"/>
<title>JBSY Asset Inventory</title>
<link rel="icon" type="image/png" href="cong.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>
:root{
  --bg0:#050709;--bg1:#090c12;--bg2:#0d1117;--bg3:#111827;--bg4:#161f2e;--bg5:#1c2840;
  --border:#1a2335;--border2:#243048;--border3:#2d3f5a;
  --accent:#2563eb;--accent2:#3b82f6;--accentg:rgba(37,99,235,0.15);
  --cyan:#06b6d4;--teal:#14b8a6;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--pink:#ec4899;
  --text:#f0f4f8;--text2:#94a3b8;--text3:#4a5568;--text4:#2d3748;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
  --r6:6px;--r8:8px;--r10:10px;--r12:12px;--r16:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:var(--sans);background:var(--bg0);color:var(--text);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
button{cursor:pointer;font-family:var(--sans)}
input,select,textarea{font-family:var(--sans)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes countUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(100%)}}
@keyframes scanLine{0%{top:0%}50%{top:calc(100% - 2px)}100%{top:0%}}
@keyframes ringPulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.2);opacity:0}}

.fade-in{animation:fadeIn .3s ease both}
.slide-right{animation:slideRight .25s ease both}
.scale-in{animation:scaleIn .2s ease both}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(37,99,235,0.12) 0%,transparent 60%),var(--bg0);padding:16px;}
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r16);padding:36px 32px;width:100%;max-width:420px;box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px rgba(37,99,235,0.08);animation:scaleIn .35s ease;}
.auth-logo-row{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.auth-logo-icon{width:46px;height:46px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 4px 20px rgba(37,99,235,.35);overflow:hidden;}
.auth-logo-text h1{font-size:17px;font-weight:800;color:var(--text);line-height:1.2}
.auth-logo-text p{font-size:11px;color:var(--text3);margin-top:2px}
.auth-tabs{display:flex;gap:3px;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:22px}
.auth-tab{flex:1;padding:8px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:600;border-radius:8px;transition:all .15s;}
.auth-tab.on{background:var(--bg4);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.field{margin-bottom:13px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--text2);margin-bottom:5px;letter-spacing:.3px}
.inp{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r8);color:var(--text);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentg)}
.inp::placeholder{color:var(--text3)}
.inp-icon-wrap{position:relative}
.inp-icon-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px;pointer-events:none}
.inp-icon-wrap .inp{padding-left:34px}
.btn-primary{width:100%;padding:11px;border:none;border-radius:var(--r8);background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;font-size:13px;font-weight:700;transition:all .15s;box-shadow:0 4px 16px rgba(37,99,235,.3);position:relative;overflow:hidden;}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,.12),transparent);transform:translateX(-100%);transition:transform .4s;}
.btn-primary:hover::before{transform:translateX(100%)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(37,99,235,.4)}
.btn-primary:active{transform:translateY(0)}
.auth-err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:var(--r8);padding:9px 12px;color:#f87171;font-size:12px;margin-top:10px;}

.app-shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;min-width:230px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;transition:transform .25s;z-index:100;}
.sb-brand{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-brand-icon{width:36px;height:36px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;box-shadow:0 2px 14px rgba(37,99,235,.3);overflow:hidden;}
.sb-brand-name{font-size:13px;font-weight:800;color:var(--text);line-height:1.2}
.sb-brand-sub{font-size:9px;color:var(--text3)}
.sb-user{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;}
.sb-uname{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-urole{font-size:10px;color:var(--text3)}
.sb-nav{padding:10px 8px;flex:1}
.sb-section{font-size:9px;font-weight:700;color:var(--text4);letter-spacing:.8px;padding:10px 8px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:transparent;color:var(--text2);border-radius:var(--r8);font-size:12px;font-weight:500;text-align:left;margin-bottom:2px;transition:all .12s;position:relative;overflow:hidden;}
.nav-btn i{width:16px;text-align:center;font-size:13px;transition:color .12s}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:var(--accentg);color:var(--accent2);font-weight:600}
.nav-btn.active i{color:var(--accent2)}
.nav-btn .nav-badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;font-size:9px;font-weight:700;padding:2px 7px;}
.sb-footer{padding:12px 8px;border-top:1px solid var(--border)}
.scanner-pill{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r8);margin-bottom:8px;}
.pulse-ring{position:relative;width:10px;height:10px;flex-shrink:0}
.pulse-ring .dot{width:10px;height:10px;border-radius:50%;background:var(--green);position:relative;z-index:1;}
.pulse-ring::before,.pulse-ring::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--green);animation:ringPulse 2s ease-out infinite;}
.pulse-ring::after{animation-delay:.8s}
.scanner-pill-text strong{font-size:11px;color:var(--text);display:block}
.scanner-pill-text span{font-size:9px;color:var(--text3)}
.btn-logout{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:var(--r8);background:transparent;color:var(--text2);font-size:11px;font-weight:500;transition:all .12s;}
.btn-logout:hover{background:rgba(239,68,68,.08);color:var(--red);border-color:rgba(239,68,68,.2)}

.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:rgba(9,12,18,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:50;}
.topbar-l{display:flex;align-items:center;gap:14px}
.page-title{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.topbar-r{display:flex;align-items:center;gap:8px}
.btn-add{display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:var(--r8);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;font-size:12px;font-weight:600;transition:all .15s;box-shadow:0 2px 12px rgba(37,99,235,.3);}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(37,99,235,.4)}
.btn-icon{width:34px;height:34px;border-radius:var(--r8);border:1px solid var(--border);background:var(--bg2);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .12s;}
.btn-icon:hover{color:var(--text);background:var(--bg3);border-color:var(--border2)}

.content{flex:1;overflow-y:auto;position:relative}

.info-banner {
  background: rgba(37,99,235,0.05);
  border-left: 4px solid var(--accent);
  padding: 12px 16px;
  margin: 16px 24px 0 24px;
  border-radius: 0 var(--r8) var(--r8) 0;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  animation: fadeIn 0.4s ease both;
}
.info-banner i { color: var(--accent2); font-size: 18px; margin-top: 2px; }
.info-banner-content { flex: 1; }
.info-banner-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.info-banner-text { font-size: 12px; color: var(--text2); line-height: 1.5; }

.tab-pane{padding:24px;animation:fadeIn .3s ease both}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r12);padding:18px;position:relative;overflow:hidden;transition:all .2s;cursor:default;}
.stat-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--bar-color,linear-gradient(90deg,var(--accent),var(--cyan)));}
.stat-icon-bg{position:absolute;top:12px;right:12px;font-size:22px;opacity:.15;transition:opacity .2s,transform .2s;}
.stat-card:hover .stat-icon-bg{opacity:.25;transform:scale(1.1)}
.stat-meta{font-size:10px;font-weight:600;color:var(--text3);margin-bottom:10px;letter-spacing:.3px}
.stat-num{font-size:28px;font-weight:900;color:var(--text);letter-spacing:-1px;animation:countUp .4s ease both}
.stat-hint{font-size:10px;color:var(--text3);margin-top:5px}

.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r12);overflow:hidden;transition:border-color .15s}
.panel:hover{border-color:var(--border2)}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.panel-title i{color:var(--accent2);font-size:13px}
.panel-body{padding:16px 18px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 14px;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.4px;background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;}
tbody tr{border-bottom:1px solid rgba(26,35,53,.6);transition:background .1s,transform .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg3)}
tbody td{padding:11px 14px;font-size:12px;color:var(--text2);vertical-align:middle}
.td-mono{font-family:var(--mono);font-size:11px;color:var(--accent2);font-weight:600}
.td-bold{font-weight:600;color:var(--text)}
.td-dim{font-size:10px;color:var(--text3)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.b-green{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.2)}
.b-blue{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.2)}
.b-amber{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.2)}
.b-red{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.b-purple{background:rgba(139,92,246,.12);color:#a78bfa;border:1px solid rgba(139,92,246,.2)}
.b-slate{background:rgba(100,116,139,.12);color:#94a3b8;border:1px solid rgba(100,116,139,.2)}
.b-cyan{background:rgba(6,182,212,.12);color:#22d3ee;border:1px solid rgba(6,182,212,.2)}
.b-pink{background:rgba(236,72,153,.12);color:#f472b6;border:1px solid rgba(236,72,153,.2)}

.row-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);display:inline-flex;align-items:center;justify-content:center;font-size:11px;transition:all .12s;margin:0 2px;}
.row-btn:hover.v{border-color:var(--accent);color:var(--accent2);background:var(--accentg)}
.row-btn:hover.e{border-color:var(--cyan);color:var(--cyan);background:rgba(6,182,212,.08)}
.row-btn:hover.d{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.08)}

.filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r10);padding:12px 14px;margin-bottom:14px;}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px}
.search-inp,.sel{padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r8);color:var(--text);font-size:12px;outline:none;transition:border-color .15s;}
.search-inp{width:100%;padding-left:32px}
.search-inp:focus,.sel:focus{border-color:var(--accent)}
.sel option{background:var(--bg2)}
.btn-sm{padding:7px 12px;border-radius:var(--r8);border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:600;transition:all .12s;}
.btn-sm:hover{color:var(--text);border-color:var(--border2)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{margin-bottom:11px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--text2);margin-bottom:5px}
.fc{width:100%;padding:9px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r8);color:var(--text);font-size:12px;outline:none;transition:border-color .15s,box-shadow .15s;}
.fc:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentg)}
.fc::placeholder{color:var(--text3)}
.fc option{background:var(--bg2)}
textarea.fc{resize:vertical;min-height:68px}

.modal-veil{position:fixed;inset:0;background:rgba(5,7,9,.88);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r16);width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 40px 100px rgba(0,0,0,.7);animation:scaleIn .2s ease;}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:1;}
.modal-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.modal-title i{color:var(--accent2)}
.modal-close{background:none;border:none;color:var(--text2);font-size:16px;transition:color .12s;padding:4px}
.modal-close:hover{color:var(--text)}
.modal-bd{padding:20px}
.modal-ft{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.btn-cancel{padding:8px 16px;border-radius:var(--r8);border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:12px;font-weight:600;transition:all .12s;}
.btn-cancel:hover{color:var(--text);border-color:var(--border2)}
.btn-save{padding:8px 20px;border-radius:var(--r8);border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:12px;font-weight:700;transition:all .15s;box-shadow:0 2px 10px rgba(37,99,235,.3);}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(37,99,235,.4)}

.scanner-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cam-box{background:var(--bg3);border:2px dashed var(--border2);border-radius:var(--r10);min-height:260px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.cam-idle{text-align:center;color:var(--text3)}
.cam-idle i{font-size:42px;display:block;margin-bottom:12px;opacity:.4}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scanLine 2s linear infinite;top:0;}
.debug-log{background:var(--bg0);border:1px solid var(--border);border-radius:var(--r8);padding:10px;font-family:var(--mono);font-size:10px;max-height:150px;overflow-y:auto;}
.dl-ok{color:var(--green)}.dl-err{color:var(--red)}.dl-info{color:var(--accent2)}.dl-warn{color:var(--amber)}
.scan-match{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r10);padding:14px;margin-top:12px;animation:fadeIn .25s ease;}
.scan-match-label{font-size:9px;font-weight:700;color:var(--cyan);letter-spacing:.5px;margin-bottom:6px}

.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-c{position:relative;min-height:220px}

.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:16px}
.rep-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r12);padding:20px;display:flex;flex-direction:column;gap:12px;transition:all .2s;}
.rep-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.rep-icon{width:46px;height:46px;border-radius:var(--r10);display:flex;align-items:center;justify-content:center;font-size:21px}
.rep-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.rep-desc{font-size:11px;color:var(--text2);line-height:1.5}
.btn-rep{width:100%;padding:9px;border-radius:var(--r8);border:none;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;}
.btn-rep:hover{transform:translateY(-1px);filter:brightness(1.1)}

  .g13{grid-template-columns:1fr 1.6fr}
  .stats-row{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
}

/* Tablets (portrait) & below: sidebar is a drawer */
@media(max-width:900px){
  .sidebar{width:260px;min-width:0;box-shadow:12px 0 40px rgba(0,0,0,.5)}
  .tab-pane{padding:16px}
  .stats-row{grid-template-columns:repeat(2,1fr)}

  .modal-veil{padding:12px}
  .btn-icon,.ham{min-width:38px;min-height:38px}
  .row-btn{width:34px;height:34px}
}

/* Phones & small tablets */

  .info-banner{margin:12px 12px 0;padding:10px 12px;gap:10px}
  .topbar{height:54px;padding:0 10px}
  .topbar-l{gap:8px}
  .stats-row{grid-template-columns:1fr 1fr;gap:10px}
  .stats-row[style*="repeat(3"]{grid-template-columns:1fr!important}
  .stat-card{padding:14px}
  .stat-num{font-size:24px}
  .panel-head{padding:12px 14px}
  .panel-body{padding:14px}

  .modal-veil{padding:0;align-items:flex-end}
  .modal-box{max-width:100%!important;width:100%;max-height:94vh;max-height:94dvh;border-radius:var(--r16) var(--r16) 0 0;border-bottom:none}
  .modal-box[style*="height"]{height:94dvh!important}

  .modal-bd{padding:16px}
  .modal-ft{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .modal-ft>button{flex:1 1 auto}
  .pal-veil{padding-top:0;align-items:flex-start}
  .pal-veil .modal-box{border-radius:0 0 var(--r16) var(--r16);border:1px solid var(--border2);max-height:80dvh}
  .pal-list{max-height:55dvh}
  .no-print[style*="display: flex"]{flex-wrap:wrap;gap:10px!important}
  .no-print .btn-save{margin-left:0!important;width:100%}
  .toast-stack{top:10px;right:10px;left:10px}
  .toast-item{min-width:0;max-width:none;width:100%}
  .notif-pop{position:fixed!important;top:60px!important;left:10px!important;right:10px!important;width:auto!important}
  .scanner-grid{gap:12px}
  .cam-box{min-height:220px}
  .tile-actions>*{flex:1 1 auto}
  .ring-row{gap:14px}
  .ring-row .grow{min-width:0}
  .tag-company{font-size:7px}
  .auth-card{padding:24px 18px;max-width:100%}
  thead th{padding:9px 10px}
  tbody td{padding:10px}
  .photo-field,.photo-view{flex-wrap:wrap}
  .sticker-sheet{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  /* 16px inputs stop iOS Safari from zooming on focus */
  .inp,.fc,.sel,.search-inp,.pal-inp,input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px!important}

/* Very small phones */
@media(max-width:380px){
  .stats-row{grid-template-columns:1fr}
  .topbar .btn-icon{min-width:34px;width:34px;height:34px}
  .topbar-r{gap:4px}
  .page-title{font-size:12px!important}
  .quick-stat-num{font-size:17px}
  .col-track{height:90px}

/* Landscape phones / short screens */
@media(max-height:480px) and (orientation:landscape){
  .auth-wrap{align-items:flex-start;padding:10px}
  .auth-card{padding:18px 20px;margin:auto}
  .modal-veil{align-items:center;padding:8px}
  .modal-box{max-height:96dvh;border-radius:var(--r12);border-bottom:1px solid var(--border2)}
  .modal-box[style*="height"]{height:96dvh!important}
  .topbar{height:46px}

}

/* Touch devices: comfortable hit areas, no sticky hover jumps */
@media(hover:none) and (pointer:coarse){
  .btn-sm,.btn-cancel,.btn-save,.btn-add,.btn-rep,.import-lbl,.btn-logout{min-height:40px}
  .nav-btn{min-height:42px}
  .nav-btn:hover{padding-left:10px}
  .stat-card:hover,.tile:hover,.rep-card:hover,.hover-card:hover{transform:none}
}

/* Notch / home-indicator safe areas */
@supports(padding:max(0px)){
  .topbar{padding-left:max(var(--tp-l,10px),env(safe-area-inset-left));padding-right:max(var(--tp-r,10px),env(safe-area-inset-right))}
  .sidebar{padding-left:env(safe-area-inset-left)}
  .content{padding-bottom:env(safe-area-inset-bottom,0px)}
}

<div id="root"></div>
<script>
const {useState,useEffect,useRef,useCallback,useMemo,Fragment}=React;
const R=React,RD=ReactDOM;
function escapeHtml(unsafe) {
  if (!unsafe) return '';
  return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
function base64ToBlobUrl(base64) {
  try {
    const parts = base64.split(';base64,');
    const contentType = parts[0].split(':')[1];
    const raw = window.atob(parts[1]);
    const rawLength = raw.length;
    const uInt8Array = new Uint8Array(rawLength);
    for (let i = 0; i < rawLength; ++i) {
      uInt8Array[i] = raw.charCodeAt(i);
    }
    const blob = new Blob([uInt8Array], {type: contentType});
    return URL.createObjectURL(blob);
  } catch (e) {
    return base64;
  }
}
function getFileExt(base64) {
  if (!base64) return 'pdf';
  if (base64.startsWith('data:image/png')) return 'png';
  if (base64.startsWith('data:image/jpeg')) return 'jpg';
  if (base64.startsWith('data:image/gif')) return 'gif';
  if (base64.startsWith('data:image/webp')) return 'webp';
  return 'pdf';
}
async function hashPassword(password) {
  const msgBuffer = new TextEncoder().encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}
let SQL = null;
let db = null;
const DB_NAME = 'jbsy.db';
async function saveDBToStorage() {
  if (!db) return;
  const data = db.export();
  const idb = await new Promise((res, rej) => {
    const req = indexedDB.open('JBSY_FileStorage', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('files');
    req.onsuccess = e => res(e.target.result);
    req.onerror = rej;
  });
  const tx = idb.transaction('files', 'readwrite');
  tx.objectStore('files').put(data, DB_NAME);
  return new Promise(r => tx.oncomplete = r);
}
async function loadDBFromStorage() {
  const idb = await new Promise((res, rej) => {
    const req = indexedDB.open('JBSY_FileStorage', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('files');
    req.onsuccess = e => res(e.target.result);
    req.onerror = rej;
  });
  return new Promise((res) => {
    const tx = idb.transaction('files', 'readonly');
    const req = tx.objectStore('files').get(DB_NAME);
    req.onsuccess = () => res(req.result || null);
    req.onerror = () => res(null);
  });
}
async function openDB() {
  SQL = await initSqlJs({
    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
  });
  const savedData = await loadDBFromStorage();
  if (savedData) {
    db = new SQL.Database(new Uint8Array(savedData));
    try { db.run("ALTER TABLE inventory ADD COLUMN attachment TEXT"); } catch(e) {}
    try { db.run("ALTER TABLE users ADD COLUMN passwordHash TEXT"); } catch(e) {}
    try { db.run("ALTER TABLE users ADD COLUMN created TEXT"); } catch(e) {}
  } else {
    try {
      const response = await fetch('jbsy.db');
      if (response.ok) {
        const arrayBuffer = await response.arrayBuffer();
        db = new SQL.Database(new Uint8Array(arrayBuffer));
        try { db.run("ALTER TABLE inventory ADD COLUMN attachment TEXT"); } catch(e) {}
        try { db.run("ALTER TABLE users ADD COLUMN passwordHash TEXT"); } catch(e) {}
        try { db.run("ALTER TABLE users ADD COLUMN created TEXT"); } catch(e) {}
        await saveDBToStorage();
      } else {
        throw new Error("jbsy.db not found on server");
      }
    } catch (err) {
      console.log("Could not load jbsy.db from server, starting fresh.", err);
      db = new SQL.Database();
      db.run(`
        CREATE TABLE IF NOT EXISTS inventory (id TEXT PRIMARY KEY, name TEXT, category TEXT, serial TEXT, brand TEXT, status TEXT, user TEXT, location TEXT, purchaseDate TEXT, warrantyDate TEXT, cost REAL, condition TEXT, notes TEXT, attachment TEXT);
        CREATE TABLE IF NOT EXISTS auditLogs (id INTEGER PRIMARY KEY AUTOINCREMENT, timestamp TEXT, tag TEXT, name TEXT, action TEXT, user TEXT, notes TEXT);
        CREATE TABLE IF NOT EXISTS maintLogs (id INTEGER PRIMARY KEY AUTOINCREMENT, timestamp TEXT, tag TEXT, name TEXT, title TEXT, tech TEXT, cost REAL, notes TEXT, resolved INTEGER);
        CREATE TABLE IF NOT EXISTS users (username TEXT PRIMARY KEY, name TEXT, role TEXT, passwordHash TEXT, created TEXT);
        CREATE TABLE IF NOT EXISTS activity (id INTEGER PRIMARY KEY AUTOINCREMENT, msg TEXT, ts TEXT, color TEXT);
      `);
      await saveDBToStorage();
    }
  }
  migrateDB();  
  await saveDBToStorage();
}
async function dbAll(store) {
  const validTables = ['inventory', 'auditLogs', 'maintLogs', 'users', 'activity'];
  if (!validTables.includes(store)) return [];
  const newestFirst = ['auditLogs','maintLogs','activity'].includes(store) ? ' ORDER BY id DESC' : '';
  const res = db.exec(`SELECT * FROM ${store}${newestFirst}`);
  if (!res.length) return [];
  const cols = res[0].columns;
  return res[0].values.map(row => {
    const obj = {};
    cols.forEach((c, i) => obj[c] = row[i]);
    return obj;
  });
}
async function dbPut(store, item) {
  const keys = Object.keys(item);
  const placeholders = keys.map(() => '?').join(',');
  const values = keys.map(k => item[k]);
  if (store === 'users') db.run(`INSERT OR REPLACE INTO users (${keys.join(',')}) VALUES (${placeholders})`, values);
  else if (store === 'inventory') db.run(`INSERT OR REPLACE INTO inventory (${keys.join(',')}) VALUES (${placeholders})`, values);
  await saveDBToStorage();
}
async function dbAdd(store, item) {
  delete item.id;
  const keys = Object.keys(item);
  const placeholders = keys.map(() => '?').join(',');
  const values = keys.map(k => item[k]);
  db.run(`INSERT INTO ${store} (${keys.join(',')}) VALUES (${placeholders})`, values);
  item.id = db.exec('SELECT last_insert_rowid()')[0].values[0][0];
  await saveDBToStorage();
}
async function dbDel(store, key) {
  if (store === 'inventory') db.run(`DELETE FROM inventory WHERE id = ?`, [key]);
  if (store === 'users') db.run(`DELETE FROM users WHERE username = ?`, [key]);
  await saveDBToStorage();
}
async function dbClear(store) {
  db.run(`DELETE FROM ${store}`);
  await saveDBToStorage();
}
function uid(){
  const key='jbsy_tag_counter';
  let next=parseInt(sessionStorage.getItem(key)||'0',10)+1;
  sessionStorage.setItem(key,next);
  return 'JBSY-'+String(next).padStart(4,'0');
}
function syncUidCounter(inv){
  let max=0;
  inv.forEach(i=>{
    const m=i.id&&i.id.match(/^JBSY-(\d+)$/);
    if(m)max=Math.max(max,parseInt(m[1],10));
  });
  const cur=parseInt(sessionStorage.getItem('jbsy_tag_counter')||'0',10);
  if(max>cur)sessionStorage.setItem('jbsy_tag_counter',max);
}
function fmtCost(n){return '₱'+(parseFloat(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2})}
function fmtDate(){return new Date().toLocaleString()}
function daysDiff(dateStr){if(!dateStr)return null;return Math.ceil((new Date(dateStr)-new Date())/86400000)}
const STATUS_BADGE={
  'Available':['b-green','fa-circle-check'],

function CondBadge({c}){const m={New:'b-cyan',Good:'b-green',Fair:'b-amber',Damaged:'b-red'};return R.createElement('span',{className:'badge '+(m[c]||'b-slate')},c);}
let _addToast=()=>{};
function toast(msg,type='i'){_addToast(msg,type)}
function ToastStack(){
  const[toasts,setToasts]=useState([]);
  useEffect(()=>{_addToast=(msg,type)=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3800);
  }},[]);
  const icons={s:'fa-circle-check',e:'fa-circle-exclamation',i:'fa-circle-info',w:'fa-triangle-exclamation'};
  return R.createElement('div',{className:'toast-stack'},
    toasts.map(t=>R.createElement('div',{key:t.id,className:`toast-item toast-${t.type}`},
      R.createElement('i',{className:'fa-solid '+(icons[t.type]||icons.i)}),t.msg
    ))
  );
}
function AuthScreen({onLogin,users,setUsers}){
  const[tab,setTab]=useState('login');
  const[lUser,setLU]=useState('');const[lPass,setLP]=useState('');const[lErr,setLE]=useState('');
  const[rName,setRN]=useState('');const[rUser,setRU]=useState('');
  const[rPass,setRP]=useState('');const[rErr,setRE]=useState('');
  const noUsers = users.length === 0;
  async function doLogin(e){
    e.preventDefault();
    if(!lUser||!lPass){setLE('Fill in all fields.');return}
    const hashed = await hashPassword(lPass);
    let checkUsers = users;
    try {
      const freshUsers = await dbAll('users');
      if(freshUsers.length > 0) checkUsers = freshUsers;
    } catch(err) {}
    const u = checkUsers.find(x => x.username === lUser && x.passwordHash === hashed);
    if(!u){setLE('Invalid username or password.');return}
    sessionStorage.setItem('jbsy_sess',JSON.stringify({username:u.username}));
    onLogin(u);
  }
  async function doReg(e){
    e.preventDefault();
    if(!rName||!rUser||!rPass){setRE('Fill in all fields.');return}
    if(rPass.length<6){setRE('Password min 6 characters.');return}
    let checkUsers = users;
    try {
      const freshUsers = await dbAll('users');
      if(freshUsers.length > 0) checkUsers = freshUsers;
    } catch(err) {}
    if(checkUsers.find(x=>x.username===rUser)){setRE('Username already taken.');return}
    const hashed = await hashPassword(rPass);
    const nu = {
      username: rUser,
      name: rName,
      role: 'Admin',  
      passwordHash: hashed,
      created: new Date().toLocaleDateString()
    };
    await dbPut('users',nu);
    setUsers(prev => [...prev, nu]); 
    toast('Admin account created — sign in now.','s');
    setTab('login');setLU(rUser);
  }
  return R.createElement('div',{className:'auth-wrap'},
    R.createElement('div',{style:{width:'100%',maxWidth:420,padding:'0 16px'}},
      R.createElement('div',{className:'auth-card'},
        R.createElement('div',{className:'auth-logo-row'},
          R.createElement('div',{className:'auth-logo-icon'},
            R.createElement('img',{src:'cong.png', alt:'Logo', style:{width:'100%', height:'100%', objectFit:'contain', padding:'4px'}})
          ),
          R.createElement('div',{className:'auth-logo-text'},
            R.createElement('h1',null,'JBSY Inventory System'),
            R.createElement('p',null,'IT Equipment Management')
          )
        ),
        noUsers && R.createElement('div',{className:'auth-tabs'},
          ['login','register'].map(t=>R.createElement('button',{key:t,className:'auth-tab '+(tab===t?'on':''),onClick:()=>{setTab(t);setLE('');setRE('')}},
            t==='login'?'Sign In':'Create Admin'
          ))
        ),
        (tab==='login'||!noUsers) ? R.createElement('form',{onSubmit:doLogin},
          R.createElement('div',{className:'field'},R.createElement('label',null,'Username'),
            R.createElement('div',{className:'inp-icon-wrap'},R.createElement('i',{className:'fa-solid fa-user'}),
              R.createElement('input',{className:'inp',placeholder:'Your username',value:lUser,onChange:e=>setLU(e.target.value),autoFocus:true}))),
          R.createElement('div',{className:'field'},R.createElement('label',null,'Password'),
            R.createElement('div',{className:'inp-icon-wrap'},R.createElement('i',{className:'fa-solid fa-lock'}),
              R.createElement('input',{className:'inp',type:'password',placeholder:'Your password',value:lPass,onChange:e=>setLP(e.target.value)}))),
          R.createElement('button',{type:'submit',className:'btn-primary'},R.createElement('i',{className:'fa-solid fa-right-to-bracket',style:{marginRight:7}}),'Sign In'),
          lErr&&R.createElement('div',{className:'auth-err'},R.createElement('i',{className:'fa-solid fa-circle-exclamation',style:{marginRight:7}}),lErr)
        ) : R.createElement('form',{onSubmit:doReg},
          R.createElement('div',{className:'auth-err',style:{marginBottom:12,background:'rgba(37,99,235,.08)',borderColor:'rgba(37,99,235,.2)',color:'#93c5fd'}},
            R.createElement('i',{className:'fa-solid fa-circle-info',style:{marginRight:7}}),'First-time setup: create the initial Admin account.'),
          R.createElement('div',{className:'field'},R.createElement('label',null,'Full Name'),R.createElement('input',{className:'inp',placeholder:'e.g. Alex Rivera',value:rName,onChange:e=>setRN(e.target.value)})),
          R.createElement('div',{className:'field'},R.createElement('label',null,'Username'),R.createElement('input',{className:'inp',placeholder:'Choose a username',value:rUser,onChange:e=>setRU(e.target.value)})),
          R.createElement('div',{className:'field'},R.createElement('label',null,'Password'),R.createElement('input',{className:'inp',type:'password',placeholder:'Min 6 characters',value:rPass,onChange:e=>setRP(e.target.value)})),
          R.createElement('button',{type:'submit',className:'btn-primary'},R.createElement('i',{className:'fa-solid fa-user-shield',style:{marginRight:7}}),'Create Admin Account'),
          rErr&&R.createElement('div',{className:'auth-err'},R.createElement('i',{className:'fa-solid fa-circle-exclamation',style:{marginRight:7}}),rErr)
        )

}
function usePrevCount(val){
  const ref=useRef(val);
  useEffect(()=>{ref.current=val},[val]);
  return ref.current;
}
function AnimNum({val}){
  const[disp,setDisp]=useState(val);
  const prev=usePrevCount(val);
  useEffect(()=>{
    let start=prev,end=val,dur=600,startTs=null;
    if(typeof start!=='number'||typeof end!=='number'){setDisp(val);return}
    function step(ts){
      if(!startTs)startTs=ts;
      const p=Math.min((ts-startTs)/dur,1);
      const ease=1-Math.pow(1-p,3);
      setDisp(Math.round(start+(end-start)*ease));
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  },[val]);
  return typeof val==='string'?R.createElement(Fragment,null,val):R.createElement(Fragment,null,disp);
}
function DashboardTab({inventory,auditLogs,maintLogs,activity}){
  const catChart=useRef(null),statusChart=useRef(null);
  const catInst=useRef(null),statusInst=useRef(null);
  const stats=useMemo(()=>{
    const total=inventory.length;
    const avail=inventory.filter(i=>i.status==='Available').length;
    const inuse=inventory.filter(i=>i.status==='In Use').length;
    const maint=inventory.filter(i=>i.status==='Under Maintenance').length;
    const miss=inventory.filter(i=>i.status==='Missing').length;
    const value=inventory.reduce((s,i)=>s+(parseFloat(i.cost)||0),0);
    return{total,avail,inuse,maint,miss,value};
  },[inventory]);
  useEffect(()=>{
    if(!catChart.current)return;
    const catC={};inventory.forEach(i=>{catC[i.category]=(catC[i.category]||0)+1});
    if(catInst.current)catInst.current.destroy();
    catInst.current=new Chart(catChart.current.getContext('2d'),{
      type:'doughnut',
      data:{labels:Object.keys(catC),datasets:[{data:Object.values(catC),backgroundColor:['#2563eb','#06b6d4','#10b981','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f43f5e'],borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',font:{size:10},padding:8,usePointStyle:true}}}}
    });
  },[inventory]);
  useEffect(()=>{
    if(!statusChart.current)return;
    const keys=['Available','In Use','Under Maintenance','Reserved','Retired','Missing','For Disposal'];
    const vals=keys.map(k=>inventory.filter(i=>i.status===k).length);
    if(statusInst.current)statusInst.current.destroy();
    statusInst.current=new Chart(statusChart.current.getContext('2d'),{
      type:'bar',
      data:{
        labels:['Available','In Use','Maintenance','Reserved','Retired','Missing','For Disposal'],
        datasets:[{data:vals,backgroundColor:['#10b981','#3b82f6','#f59e0b','#8b5cf6','#64748b','#ef4444','#ec4899'],borderRadius:6,borderWidth:0}]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{ticks:{color:'#4a5568',font:{size:9}},grid:{display:false}},
          y:{ticks:{color:'#4a5568',precision:0,font:{size:9}},grid:{color:'rgba(26,35,53,.6)'},beginAtZero:true}}}
    });
  },[inventory]);
  const alerts=useMemo(()=>{
    const out=[];
    inventory.forEach(item=>{
      if(item.warrantyDate){
        const d=daysDiff(item.warrantyDate);
        if(d<0)out.push({type:'exp',item,msg:`Warranty expired ${Math.abs(d)} days ago`});

function migrateDB(){
  db.run(`
    CREATE TABLE IF NOT EXISTS inventory (id TEXT PRIMARY KEY, name TEXT, category TEXT, serial TEXT, brand TEXT, status TEXT, user TEXT, location TEXT, purchaseDate TEXT, warrantyDate TEXT, cost REAL, condition TEXT, notes TEXT, attachment TEXT);
    CREATE TABLE IF NOT EXISTS auditLogs (id INTEGER PRIMARY KEY AUTOINCREMENT, timestamp TEXT, tag TEXT, name TEXT, action TEXT, user TEXT, notes TEXT);
    CREATE TABLE IF NOT EXISTS maintLogs (id INTEGER PRIMARY KEY AUTOINCREMENT, timestamp TEXT, tag TEXT, name TEXT, title TEXT, tech TEXT, cost REAL, notes TEXT, resolved INTEGER);
    CREATE TABLE IF NOT EXISTS users (username TEXT PRIMARY KEY, name TEXT, role TEXT, passwordHash TEXT, created TEXT);
    CREATE TABLE IF NOT EXISTS activity (id INTEGER PRIMARY KEY AUTOINCREMENT, msg TEXT, ts TEXT, color TEXT);
    CREATE TABLE IF NOT EXISTS licenses (id TEXT PRIMARY KEY, name TEXT, vendor TEXT, seats INTEGER, assignees TEXT, renewalDate TEXT, cost REAL, notes TEXT);
    CREATE TABLE IF NOT EXISTS stock (id TEXT PRIMARY KEY, name TEXT, category TEXT, qty INTEGER, minQty INTEGER, location TEXT, notes TEXT);
    CREATE TABLE IF NOT EXISTS stocktakes (id TEXT PRIMARY KEY, ts TEXT, scope TEXT, expected INTEGER, found INTEGER, missing TEXT, auditor TEXT);
  `);
  ['attachment','empId','position','immHead','empStatus','purpose','dept','contact','email','photo'].forEach(c=>{try{db.run(`ALTER TABLE inventory ADD COLUMN ${c} TEXT`)}catch(e){}});
  ['passwordHash','created'].forEach(c=>{try{db.run(`ALTER TABLE users ADD COLUMN ${c} TEXT`)}catch(e){}});
}
async function xPut(table,item){
  if(!EXTRA_TABLES.includes(table))return;
  const k=Object.keys(item);
  db.run(`INSERT OR REPLACE INTO ${table} (${k.join(',')}) VALUES (${k.map(()=>'?').join(',')})`,k.map(x=>item[x]));
  await saveDBToStorage();
}
async function xDel(table,id){
  if(!EXTRA_TABLES.includes(table))return;
  db.run(`DELETE FROM ${table} WHERE id = ?`,[id]);
  await saveDBToStorage();
}

  const age=Math.max(0,(Date.now()-t)/31557600000);

  function start(){
    const ids=inventory.filter(i=>!['Retired','For Disposal'].includes(i.status)&&(!scope||i.location===scope)).map(i=>i.id);
    if(!ids.length){toast('No assets in this scope','w');return}

  }

    isAdmin&&session&&h('div',{className:'panel mb20'},h(Head,{icon:'fa-barcode',title:'Auditing: '+session.scope},h('button',{className:'btn-sm',onClick:()=>{if(confirm('Discard this audit?'))setSession(null)}},'Discard')),
      h('div',{className:'panel-body'},
        h('div',{className:'ring-row'},h(Ring,{pct,color:pct===100?'var(--green)':'var(--accent2)',label:pct+'%',sub:found.length+' / '+expected.length}),
          h('div',{className:'grow'},
            h('form',{onSubmit:scan,className:'filter-inline'},h('input',{className:'fc grow',autoFocus:true,placeholder:'Scan or type asset tag / serial, then Enter',value:code,onChange:e=>setCode(e.target.value)}),h('button',{className:'btn-save',type:'submit'},'Verify')),
